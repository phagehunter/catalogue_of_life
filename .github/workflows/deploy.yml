name: Build and deploy site

# Runs when a data Release is published (the release must carry the ColDP
# files) or manually from the Actions tab. The processed data is cached per
# (release tag, row limit, processor version), so a frontend-only re-run with
# the same tag finishes in a couple of minutes.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag holding the ColDP files (e.g. data-v1)'
        required: true
        default: 'data-v1'
      limit:
        description: 'Optional row cap per TSV for a smoke test (e.g. 50000). Blank = full build.'
        required: false
        default: ''

permissions:
  contents: write   # push to the gh-pages branch

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.release_tag || 'data-v1' }}
      ROW_LIMIT: ${{ github.event.inputs.limit || '' }}
      PROJECT_DIR: ${{ github.workspace }}/website
      RAW_DIR: ${{ github.workspace }}/raw
      DATA_DIR: ${{ github.workspace }}/website/frontend/public/data

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show trigger
        run: |
          echo "Event:       ${{ github.event_name }}"
          echo "Release tag: $RELEASE_TAG"
          echo "Row limit:   ${ROW_LIMIT:-<none: full build>}"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/share/swift /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: website/frontend/package-lock.json

      - name: Processor unit tests
        working-directory: website/scripts
        run: python -m unittest tests/test_process_data.py

      # Keyed on the release tag, the row limit AND the processor source, so
      # a change to process_data.py always produces fresh data.
      - name: Restore processed data from cache
        id: cache-data
        uses: actions/cache@v4
        with:
          path: website/frontend/public/data
          key: col-data-${{ env.RELEASE_TAG }}-limit-${{ env.ROW_LIMIT || 'full' }}-${{ hashFiles('website/scripts/process_data.py') }}

      - name: Download ColDP files from the Release
        if: steps.cache-data.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RAW_DIR"
          for PATTERN in "NameUsage.tsv" "NameUsage_part_*" "VernacularName.tsv" "Distribution.tsv" "metadata.yaml"; do
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$PATTERN" --dir "$RAW_DIR" --clobber || true
          done
          ls -lah "$RAW_DIR"
          if ! ls "$RAW_DIR"/NameUsage* >/dev/null 2>&1; then
            echo "::error::Release '$RELEASE_TAG' has no NameUsage.tsv or NameUsage_part_* assets."
            exit 1
          fi

      - name: Process ColDP into static data
        if: steps.cache-data.outputs.cache-hit != 'true'
        run: |
          ARGS=(--input "$RAW_DIR" --output "$DATA_DIR")
          if [ -n "$ROW_LIMIT" ]; then ARGS+=(--limit "$ROW_LIMIT"); fi
          python "$PROJECT_DIR/scripts/process_data.py" "${ARGS[@]}"
          rm -rf "$RAW_DIR"
          du -sh "$DATA_DIR"
          echo "Files: $(find "$DATA_DIR" -type f | wc -l)"

      - name: Using cached data
        if: steps.cache-data.outputs.cache-hit == 'true'
        run: echo "Reused processed data for $RELEASE_TAG"; du -sh "$DATA_DIR"

      - name: Install frontend dependencies
        working-directory: website/frontend
        run: npm ci

      - name: Frontend tests
        working-directory: website/frontend
        run: npm test

      - name: Build frontend
        working-directory: website/frontend
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: website/frontend/dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy ${{ env.RELEASE_TAG }} (${{ github.sha }})'
